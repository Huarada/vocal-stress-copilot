name: Tests

# Runs the unit suite (300 tests) on every push/PR. Deliberately excludes two marker
# groups that cannot pass in CI, not because they're broken but because of what they
# need (ADR-016: never committed to this repo):
#   - integration: real RAVDESS/MUStARD++ audio under databaseAudio/sarcasmoVoz
#     (licensed, gitignored) — these skip gracefully when the data is absent, but
#     excluding them keeps CI fast and the run unambiguous rather than "300 passed, 12
#     skipped, is that expected?"
#   - quality_gate: reads artifacts/metrics/latest.json, produced only by a real
#     training run (scripts/train_arousal_model.py) — never checked in.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # `sounddevice` (scripts/run_interview.py's mic path) links against PortAudio at
      # import time — bundled on Windows, present on the local dev machine this suite
      # was verified on, but not on ubuntu-latest by default. Without this,
      # test_mic_source.py fails at COLLECTION (OSError, not a test failure), which
      # aborts the whole run before a single test executes.
      - name: Install system audio library (sounddevice/PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -m "not integration and not quality_gate" -q
