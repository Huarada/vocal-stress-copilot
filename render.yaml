# Render Blueprint (render.com/docs/blueprint-spec).
#
# Two independent controls (ADR-045/047/049), not declared here on purpose so this
# file doesn't force a value during Blueprint creation:
#
#   ASSEMBLYAI_API_KEY            - powers /chat (the Analyst Agent). Bounded cost per
#                                    request (at most two LLM Gateway calls, no card on
#                                    file) - safe to set here for a public demo.
#   VOICESTRESS_ENABLE_LIVE_CAPTURE - must be the literal string "true" to turn on
#                                    /ws/interview. Defaults to disabled regardless of
#                                    whether an API key is set - a continuous,
#                                    per-minute-billed voice session is a materially
#                                    bigger exposure than a single bounded chat request,
#                                    and this project's policy is: local demo only for
#                                    that one, in the video, not on a public host.
#
# To add the chat key to an already-deployed service: Render dashboard -> this service
# -> Environment -> Add Environment Variable -> ASSEMBLYAI_API_KEY. Leave
# VOICESTRESS_ENABLE_LIVE_CAPTURE unset (or "false") unless you deliberately want live
# capture reachable by anyone who finds the URL.
services:
  - name: vocal-stress-copilot
    type: web
    runtime: python
    plan: free
    # "pip install --upgrade pip" first: pip 25.0.1's hash-verification logic hit a
    # false-positive "hashes don't match" failure on an unrelated PyPI metadata blob
    # during a real local dry run of this exact build command (2026-09-06), fixed by
    # upgrading to 26.2.1. Every package downloaded fine; only pip's own resolver was
    # at fault. Pinning this step avoids the same failure on whatever pip version
    # Render's base Python image ships with.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: python -m uvicorn web.backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
